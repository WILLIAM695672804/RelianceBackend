# Point d'entrée unique de Reliance : un seul nom de domaine pour l'interface,
# l'API et le WebSocket.
#
# Pourquoi un seul domaine. L'authentification repose sur Sanctum en mode SPA,
# donc sur un cookie de session et un jeton CSRF. Entre deux origines, ce cookie
# est « cross-site » : le navigateur ne l'envoie qu'au prix de SameSite=None,
# d'un en-tête X-XSRF-TOKEN et d'une configuration CORS exacte, et la moindre
# erreur se traduit par un 419 incompréhensible. Sur une seule origine, rien de
# tout cela n'est nécessaire.
#
# Le découpage se fait donc par chemin :
#   /api, /sanctum, /broadcasting         → Laravel (php-fpm)
#   /storage                             → fichiers déposés, servis directement
#   /app, /apps                          → Reverb (WebSocket, protocole Pusher)
#   tout le reste                        → l'interface React, avec repli sur
#                                          index.html pour les routes du client

upstream php {
    server api:9000;
}

upstream reverb {
    server reverb:8080;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 16M;

    # Le frontal se charge du chiffrement et des en-têtes de sécurité ; ici on
    # ne répète que ce qui dépend du contenu servi.
    add_header X-Content-Type-Options nosniff always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ---------------------------------------------------------------- Laravel
    # Rien d'autre ne va à Laravel : les webhooks de NotchPay sont sous
    # /api/v1/webhooks, et les routes du client React sont en français
    # (/connexion, /carte…) — les envoyer à PHP rendrait un 404 au lieu de
    # l'interface.
    location ~ ^/(api|sanctum|broadcasting)(/|$) {
        include fastcgi_params;
        fastcgi_pass php;
        fastcgi_param SCRIPT_FILENAME /app/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /app/public;

        # Le frontal est le seul à parler au monde : c'est lui qui connaît le
        # protocole et l'adresse réelle du visiteur.
        fastcgi_param HTTPS on;
        fastcgi_param REQUEST_SCHEME https;
        fastcgi_param SERVER_PORT 443;

        # Une connexion SSE dure jusqu'à SSE_MAX_SECONDS (300 s par défaut).
        fastcgi_read_timeout 330s;
        fastcgi_buffering off;
    }

    # ------------------------------------------------- fichiers déposés
    # Volume « storage » monté en lecture seule. Les documents confidentiels
    # (pièces d'identité, justificatifs) vivent dans storage/app/private, hors
    # de cette arborescence : ils ne passent que par Laravel, qui vérifie les
    # droits. Voir « php artisan stockage:privatiser ».
    location /storage/ {
        alias /srv/storage/app/public/;
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # ----------------------------------------------------------------- Reverb
    location ~ ^/(app|apps)(/|$) {
        proxy_pass http://reverb;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # Un WebSocket inactif ne doit pas être coupé : le ping de Reverb est
        # à 60 s, on laisse largement au-delà.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # -------------------------------------------------------------- interface
    # Les noms des fichiers compilés portent une empreinte : ils ne changent
    # jamais sous le même nom.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html n'est jamais mis en cache, sinon un déploiement passe inaperçu
    # pendant des heures.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
