; Réglages de production. Le serveur a deux cœurs et 4 Go partagés avec une
; autre application : les valeurs sont volontairement sobres.

memory_limit = 256M
max_execution_time = 60

; Dépôt de pièces jointes et de documents d'identité.
upload_max_filesize = 12M
post_max_size = 16M

; Aucune trace vers le navigateur : elles exposent chemins et secrets.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr

expose_php = Off

; Le code ne change qu'au déploiement : inutile de vérifier les dates des
; fichiers à chaque requête.
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 96
opcache.interned_strings_buffer = 12
opcache.max_accelerated_files = 12000

date.timezone = Africa/Douala
